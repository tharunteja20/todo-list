<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List | Tharun Teja</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#101820;--muted:#4b5a6a;--accent:#0f766e;--accent-ink:#fff;--danger:#b42318;--line:#d5dde6}
@media (prefers-color-scheme: dark){:root{--bg:#0e141b;--surface:#16202b;--ink:#eaf0f6;--muted:#9db0c2;--accent:#2dd4bf;--accent-ink:#06201d;--danger:#f97066;--line:#27364a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh;padding:24px 16px}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.app{max-width:560px;margin:0 auto}
h1{font-size:clamp(1.8rem,7vw,2.6rem);margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;padding:12px 14px;font-size:1rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.add input:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--accent)}
.add button{padding:0 20px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.error{color:var(--danger);min-height:1.5em;margin:6px 2px 0;font-size:.95rem}
.filters{display:flex;gap:8px;margin:12px 0}
.filters button{padding:6px 14px;background:transparent;color:var(--accent);font-size:.95rem}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
li .del{border:none;background:transparent;color:var(--danger);font-weight:600;padding:6px 8px}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.95rem}
.foot button{background:transparent;color:var(--danger);border-color:var(--danger);padding:6px 12px;font-size:.9rem}
.history{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.history .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history h2{font-size:1.3rem;margin:0}
.history .head button{background:transparent;color:var(--danger);border-color:var(--danger);padding:6px 12px;font-size:.9rem}
.history li{justify-content:space-between}
.history time{color:var(--muted);font-size:.85rem;white-space:nowrap}
</style>
</head>
<body>
<main class="app">
  <h1>My Tasks</h1>
  <p class="sub">Add a task, tick it off, delete it. Completed work is kept in History. Everything is saved on this device.</p>

  <div class="add">
    <input id="taskInput" type="text" placeholder="What needs doing?" maxlength="120" aria-label="New task" autocomplete="off">
    <button id="addBtn" type="button">Add</button>
  </div>
  <div class="error" id="error" role="alert"></div>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="active" aria-pressed="false">Active</button>
    <button type="button" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list" aria-live="polite"></ul>

  <div class="foot">
    <span id="count"></span>
    <button id="clearBtn" type="button">Clear completed</button>
  </div>

  <section class="history" aria-labelledby="histTitle">
    <div class="head">
      <h2 id="histTitle">History</h2>
      <button id="clearHistBtn" type="button">Clear history</button>
    </div>
    <ul id="histList"></ul>
  </section>
</main>

<script>
const KEY = "tharun-todo-tasks";
const HKEY = "tharun-todo-history";
const histList = document.getElementById("histList");
const clearHistBtn = document.getElementById("clearHistBtn");
const input = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const list = document.getElementById("list");
const errorEl = document.getElementById("error");
const countEl = document.getElementById("count");
const clearBtn = document.getElementById("clearBtn");
const filterBtns = document.querySelectorAll(".filters button");

let tasks = load(KEY);
let history = load(HKEY);
let filter = "all";

function load(key){
  try{
    const data = JSON.parse(localStorage.getItem(key));
    return Array.isArray(data) ? data : [];
  }catch(e){ return []; }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(tasks));
    localStorage.setItem(HKEY, JSON.stringify(history));
  }catch(e){}
}

function addTask(){
  const text = input.value.trim();
  if(!text){
    errorEl.textContent = "Please type a task first.";
    input.focus();
    return;
  }
  errorEl.textContent = "";
  tasks.push({ id: Date.now(), text: text, done: false });
  input.value = "";
  save();
  render();
  input.focus();
}

function toggleTask(id){
  const t = tasks.find(function(x){ return x.id === id; });
  if(t){
    t.done = !t.done;
    history = history.filter(function(h){ return h.id !== t.id; });
    if(t.done){ history.unshift({ id: t.id, text: t.text, doneAt: Date.now() }); }
    save();
    render();
  }
}
function deleteTask(id){
  tasks = tasks.filter(function(x){ return x.id !== id; });
  save();
  render();
}

function render(){
  list.innerHTML = "";
  const shown = tasks.filter(function(t){
    if(filter === "active") return !t.done;
    if(filter === "done") return t.done;
    return true;
  });

  if(shown.length === 0){
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = tasks.length === 0 ? "No tasks yet. Add your first one above." : "Nothing here.";
    list.appendChild(empty);
  }

  shown.forEach(function(t){
    const li = document.createElement("li");
    if(t.done) li.className = "done";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.setAttribute("aria-label", "Mark complete: " + t.text);
    cb.addEventListener("change", function(){ toggleTask(t.id); });

    const span = document.createElement("span");
    span.textContent = t.text;

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "Delete";
    del.setAttribute("aria-label", "Delete task: " + t.text);
    del.addEventListener("click", function(){ deleteTask(t.id); });

    li.append(cb, span, del);
    list.appendChild(li);
  });

  renderHistory();

  const left = tasks.filter(function(t){ return !t.done; }).length;
  countEl.textContent = left + (left === 1 ? " task left" : " tasks left");
  clearBtn.hidden = !tasks.some(function(t){ return t.done; });
}

function renderHistory(){
  histList.innerHTML = "";
  if(history.length === 0){
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "No completed tasks yet.";
    histList.appendChild(empty);
  }
  history.forEach(function(h){
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = h.text;
    const time = document.createElement("time");
    time.dateTime = new Date(h.doneAt).toISOString();
    time.textContent = new Date(h.doneAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    li.append(span, time);
    histList.appendChild(li);
  });
  clearHistBtn.hidden = history.length === 0;
}

clearHistBtn.addEventListener("click", function(){
  history = [];
  save();
  render();
});

addBtn.addEventListener("click", addTask);
input.addEventListener("keydown", function(e){ if(e.key === "Enter") addTask(); });
input.addEventListener("input", function(){ errorEl.textContent = ""; });

clearBtn.addEventListener("click", function(){
  tasks = tasks.filter(function(t){ return !t.done; });
  save();
  render();
});

filterBtns.forEach(function(btn){
  btn.addEventListener("click", function(){
    filter = btn.dataset.filter;
    filterBtns.forEach(function(b){ b.setAttribute("aria-pressed", String(b === btn)); });
    render();
  });
});

render();
</script>
</body>
</html>
